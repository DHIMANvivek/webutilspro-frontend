<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe to Notifications - WebUtilsPro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f8fafc;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 80%;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 12px;
        }
        p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 16px;
            font-size: 14px;
            color: #dc2626;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔔</div>
        <h1>Enable Notifications</h1>
        <p>Please click the button below and then select "Allow" in the browser prompt to receive updates.</p>
        <button id="subscribe-btn" class="btn">Click to Allow</button>
        <div id="status-msg" class="status"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js';

        const params = new URLSearchParams(window.location.search);
        const API_KEY = params.get('apiKey');
        const API_URL = 'https://api.webutilspro.cloud/api/notifications';
        const PARENT_URL = params.get('url') || '';

        const btn = document.getElementById('subscribe-btn');
        const statusMsg = document.getElementById('status-msg');

        function showError(msg) {
            statusMsg.textContent = msg;
            statusMsg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Try Again';
        }

        async function init() {
            if (!API_KEY) {
                showError('API Key is missing');
                return;
            }

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                btn.textContent = 'Processing...';

                try {
                    // Check support
                    if (!('Notification' in window)) {
                        showError('Your browser does not support notifications');
                        return;
                    }

                    // Request permission
                    const permission = await Notification.requestPermission();
                    if (permission !== 'granted') {
                        showError('Permission denied. Please enable notifications in your browser settings.');
                        return;
                    }

                    // Get Config
                    const configRes = await fetch(`${API_URL}/config?apiKey=${API_KEY}`);
                    const firebaseConfig = await configRes.json();

                    // Initialize
                    const app = initializeApp(firebaseConfig);
                    const messaging = getMessaging(app);

                    // Get Token
                    const token = await getToken(messaging, {
                        vapidKey: firebaseConfig.vapidKey
                    });

                    // Subscribe
                    const subRes = await fetch(`${API_URL}/subscribe`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token,
                            apiKey: API_KEY,
                            url: PARENT_URL,
                            userAgent: navigator.userAgent
                        })
                    });

                    if (subRes.ok) {
                        btn.textContent = 'Successfully Subscribed!';
                        btn.style.background = '#22c55e';
                        
                        // Notify parent and close
                        if (window.opener) {
                            window.opener.postMessage({ type: 'PUSH_SUBSCRIBED' }, '*');
                        }
                        
                        setTimeout(() => {
                            window.close();
                        }, 1500);
                    } else {
                        throw new Error('Subscription failed');
                    }

                } catch (error) {
                    console.error('Error:', error);
                    showError('Failed to subscribe. Please try again.');
                }
            });
        }

        init();
    </script>
</body>
</html>
